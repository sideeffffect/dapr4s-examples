name: dapr4s Mill plugin
description: >-
  publishLocal the mill-dapr4s-wasm plugin that build.mill's header loads, from the dapr4s commit pinned in
  wasm/dapr4s-wasm.env (cached per commit), and the unreleased mill-scalablytyped dapr4s's meta-build loads.
  Every job that runs ./mill needs both until they are released.
runs:
  using: composite
  steps:
    - name: Read the dapr4s pin (wasm/dapr4s-wasm.env)
      shell: bash
      run: grep -E '^[A-Z0-9_]+=' wasm/dapr4s-wasm.env >> "$GITHUB_ENV"
    # dapr4s's meta-build loads an unreleased mill-scalablytyped: dapr4s's scripts/upstream-snapshot.sh (at the
    # pinned commit) builds it from a pinned upstream commit and installs it locally. Cached by the script's hash.
    # Mill itself is the released 1.3.1 (.mill-version).
    - name: Fetch dapr4s's upstream-snapshot.sh
      id: snapshot
      shell: bash
      run: |
        f="$RUNNER_TEMP/upstream-snapshot.sh"
        curl -fsSL --retry 3 -o "$f" \
          "https://raw.githubusercontent.com/sideeffffect/dapr4s/$DAPR4S_COMMIT/scripts/upstream-snapshot.sh"
        chmod +x "$f"
        echo "script=$f" >> "$GITHUB_OUTPUT"
        echo "hash=$(sha256sum "$f" | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - name: Cache the upstream mill-scalablytyped snapshot
      uses: actions/cache@v5
      with:
        path: ~/.ivy2/local/com.github.lolgab
        key: upstream-snapshot-${{ steps.snapshot.outputs.hash }}
    - name: Build the upstream mill-scalablytyped snapshot
      shell: bash
      run: ${{ steps.snapshot.outputs.script }}
    - name: Cache the dapr4s Mill plugin (~/.ivy2/local)
      id: cache
      uses: actions/cache@v5
      with:
        path: ~/.ivy2/local/com.github.sideeffffect/mill-dapr4s-wasm_mill1_3
        key: mill-dapr4s-wasm-${{ env.DAPR4S_COMMIT }}
    - name: Publish the dapr4s Mill plugin locally (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: wasm/scripts/publish-dapr4s-wasm.sh plugin

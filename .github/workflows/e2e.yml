name: E2E Tests

on:
  push:
    branches: [main, master]
  # Every pull request, also those stacked on another PR's branch.
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Mill and Coursier
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
            out
          key: mill-${{ hashFiles('.mill-version', 'build.mill') }}-${{ hashFiles('**/*.scala') }}
          restore-keys: |
            mill-${{ hashFiles('.mill-version', 'build.mill') }}-
            mill-

      # build.mill's header loads the dapr4s Mill plugin (examples 18/19): publishLocal it first.
      - uses: ./.github/actions/dapr4s-mill-plugin

      # checkFormatAll reads .scalafmt.conf and honours its project.excludeFilters,
      # so the experimental capture-checking `^{...}` files scalafmt can't parse are
      # skipped. Fails (exit 1) on any misformatted, non-excluded source.
      - name: Check formatting (scalafmt)
        run: ./mill mill.scalalib.scalafmt/checkFormatAll

  e2e:
    runs-on: ubuntu-latest
    # First (cache-miss) run pulls ~2.5GB of images and boots the heavy SigNoz
    # stack for example 14; warm runs are much faster.
    timeout-minutes: 45
    # Split across two runners so the heavy SigNoz suite (example 14) runs in
    # parallel with the 13 lighter suites instead of serially behind the global
    # suite semaphore: `core` runs everything and skips 14 (E2E_SKIP_OBSERVABILITY),
    # `observability` runs only 14. Both legs share the same image cache.
    strategy:
      fail-fast: false
      matrix:
        suite: [core, observability]
    name: e2e (${{ matrix.suite }})
    # Job-level so the optional Docker Hub login step can gate on it in `if:`
    # (a step cannot read its own step-level env in `if:`). Empty unless set.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Mill and Coursier
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
            out
          key: mill-${{ hashFiles('.mill-version', 'build.mill') }}-${{ hashFiles('**/*.scala') }}
          restore-keys: |
            mill-${{ hashFiles('.mill-version', 'build.mill') }}-
            mill-

      # ── Container image cache ────────────────────────────────────────────────
      # The E2E suite boots every example's Docker stack via Testcontainers. Cold
      # pulls of all images (incl. the heavy SigNoz + ClickHouse set for example 14)
      # are slow and hit Docker Hub's anonymous rate limit. We cache `docker save`
      # tarballs of the exact image set, keyed by a hash of that set, and `docker load`
      # them on a hit — so each image is fetched from a registry at most once per set.
      # build.mill's header loads the dapr4s Mill plugin (examples 18/19): publishLocal it first.
      - uses: ./.github/actions/dapr4s-mill-plugin

      - name: Compute image set
        id: imageset
        run: |
          grep -rhoE 'image:[[:space:]]*[^[:space:]]+' e2e/docker/*.yml \
            | sed -E 's/image:[[:space:]]*//' | sort -u > /tmp/ci-images.txt
          echo "Images to cache:"; cat /tmp/ci-images.txt
          echo "hash=$(sha256sum /tmp/ci-images.txt | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore Docker image cache
        id: imgcache
        uses: actions/cache/restore@v5
        with:
          path: ~/.docker-image-cache
          key: docker-images-v1-${{ steps.imageset.outputs.hash }}

      - name: Load cached images
        if: steps.imgcache.outputs.cache-hit == 'true'
        run: docker load -i ~/.docker-image-cache/images.tar

      # Optional: authenticate to Docker Hub to lift the anonymous pull-rate limit on
      # the cold pull. No-op unless the DOCKERHUB_USERNAME/DOCKERHUB_TOKEN repo secrets
      # are set (secrets aren't readable in `if:`, so they're mapped to env first).
      - name: Log in to Docker Hub (optional)
        if: steps.imgcache.outputs.cache-hit != 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and save images (cache miss)
        id: pullsave
        if: steps.imgcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.docker-image-cache
          # Pull concurrently to cut wall-clock, then snapshot all images into a single
          # tarball so shared base layers (e.g. the eclipse-temurin base) are stored once.
          xargs -P 4 -I{} docker pull -q {} < /tmp/ci-images.txt
          docker save $(tr '\n' ' ' < /tmp/ci-images.txt) -o ~/.docker-image-cache/images.tar

      # Each leg builds only the assembly JARs its suites need (e2e.testForked no
      # longer force-builds every example — see build.mill forkArgs).
      - name: Build assembly JARs (core — all)
        if: matrix.suite == 'core'
        # `_` = the top-level modules: the JVM shells (and the e2e/JS modules, as before), not the wasm.* ones.
        run: ./mill _.assembly

      - name: Build assembly JARs (observability — example 14 only)
        if: matrix.suite == 'observability'
        # Mill 1.x needs `+` between tasks: without it the second task is passed as an argument to the
        # first (which ignores it), so only 14-orders-shell was built and the pricing jar was missing.
        run: ./mill 14-orders-shell.assembly + 14-pricing-shell.assembly

      # Docker (and docker compose v2) is pre-installed on ubuntu-latest.
      # Tests spin up Dapr infrastructure via Testcontainers; no dapr CLI needed.
      - name: Run E2E tests (core — all but observability + Scala.js)
        if: matrix.suite == 'core'
        run: ./mill e2e.testForked
        env:
          E2E_SKIP_OBSERVABILITY: '1'
          # The Scala.js suites (15/16/17) run on the dedicated e2e-scala-js job below,
          # which sets up Node 25 + npm + the linked Wasm bundles they need.
          E2E_SKIP_JS: '1'

      - name: Run E2E tests (observability only)
        if: matrix.suite == 'observability'
        run: ./mill e2e.testForked '*observability*'

      # Persist only when the pull step actually succeeded (avoid caching a partial
      # tarball from a rate-limited pull); `always()` so a later test failure still
      # keeps the freshly pulled images for the next run.
      - name: Save Docker image cache
        if: always() && steps.imgcache.outputs.cache-hit != 'true' && steps.pullsave.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ~/.docker-image-cache
          key: docker-images-v1-${{ steps.imageset.outputs.hash }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.suite }}
          path: out/e2e/testForked.dest/
          if-no-files-found: ignore

  # ── Scala.js examples (15/16/17) ──────────────────────────────────────────────
  # Separate job because the Scala.js examples need a different toolchain than the
  # JVM ones: Node 25 (JSPI on by default — the dapr4s Wasm capability layer needs
  # it), npm runtime deps (@dapr/dapr + express, loaded by the linked bundle), and
  # `fastLinkJS` (Wasm) instead of `assembly`. Each example service runs as a Node
  # container + daprd sidecar (docker-compose.{15,16,17}-*.yml); the suites are the
  # JS twins of examples 12/13/14 and validate the published dapr4s_sjs1_3 artifact.
  e2e-scala-js:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: e2e (scala-js)

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Mill and Coursier
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
            out
          key: mill-js-${{ hashFiles('.mill-version', 'build.mill') }}-${{ hashFiles('**/*.scala') }}
          restore-keys: |
            mill-js-${{ hashFiles('.mill-version', 'build.mill') }}-
            mill-js-

      # build.mill's header loads the dapr4s Mill plugin (examples 18/19): publishLocal it first.
      - uses: ./.github/actions/dapr4s-mill-plugin

      # JSPI is on by default from Node 25; the linked Wasm bundles suspend on it.
      - name: Set up Node 25
        uses: actions/setup-node@v5
        with:
          node-version: '25'

      # Runtime npm deps the bundles import at run time (mounted into each app container).
      - name: Install runtime npm deps (@dapr/dapr + express)
        run: npm ci
        working-directory: e2e/js

      # Link every Scala.js module to a Wasm ES-module bundle (out/<shell>/fastLinkJS.dest).
      # The `_.fastLinkJS` wildcard runs the task on all top-level JS modules in one resolution (`_`, not
      # `__`: the wasm.* modules are components, built by `./mill wasm.e2e`) — do NOT
      # list them as `./mill a.fastLinkJS b.fastLinkJS …`: Mill parses the trailing tokens as
      # ARGUMENTS to the first task, so only the first bundle would be linked.
      - name: Link Scala.js example bundles (Wasm)
        run: ./mill _.fastLinkJS

      # The `*Js*` glob selects exactly the three Scala.js suites (Example15/16/17…JsTest).
      - name: Run Scala.js E2E tests (examples 15/16/17)
        run: ./mill e2e.testForked '*Js*'

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-scala-js
          path: out/e2e/testForked.dest/
          if-no-files-found: ignore

  # ── WASI-component examples (18/19) ───────────────────────────────────────────
  # The Wasm examples (18/19) are Mill modules of this build (`object wasm` in build.mill), built with dapr4s's
  # Mill plugin mill-dapr4s-wasm. dapr4s itself comes from Maven Central (dapr4s_sjs1_3 3.0.0); the plugin and the
  # small dapr4s wasm artifacts (dapr4s-wasm, dapr4s-wasm-glue(-exports), dapr4s-wasm-scalalib-overlay,
  # dapr4s-wasm-linker) come from a publishLocal of the dapr4s commit PINNED in wasm/dapr4s-wasm.env (a commit of
  # https://github.com/sideeffffect/dapr4s/pull/47). Once they are released, the pin becomes a release version and
  # the dapr4s publish step goes away.
  # The components are composed with dapr-wasm-components 0.7.5 (compose.sh at the v0.7.5 tag) and run
  # in `wasmtime serve` next to a real daprd (dapr CLI, slim) + Redis (Docker); the e2e asserts their
  # real output, including 04's unchanged JVM caller calling the Wasm greeting-service.
  e2e-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: e2e (wasm components)

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Read the dapr4s pin (wasm/dapr4s-wasm.env)
        run: grep -E '^[A-Z0-9_]+=' wasm/dapr4s-wasm.env >> "$GITHUB_ENV"

      - name: Cache Mill and Coursier
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
            out
          key: mill-wasm-${{ hashFiles('.mill-version', 'build.mill') }}-${{ hashFiles('**/*.scala') }}
          restore-keys: |
            mill-wasm-${{ hashFiles('.mill-version', 'build.mill') }}-
            mill-wasm-

      # Same tool versions as dapr4s's own wasm CI leg.
      - name: Install wasm tools (wasm-tools, wasmtime, wkg, wac)
        env:
          WASM_TOOLS_VERSION: 1.261.0
          WASMTIME_VERSION: 49.0.2
          WKG_VERSION: 0.16.1
          WAC_VERSION: 0.10.0
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"
          rel=https://github.com/bytecodealliance
          curl -fsSL "$rel/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C /tmp
          mv "/tmp/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$bin/"
          curl -fsSL "$rel/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" \
            | tar -xJ -C /tmp
          mv "/tmp/wasmtime-v${WASMTIME_VERSION}-x86_64-linux/wasmtime" "$bin/"
          curl -fsSL -o "$bin/wkg" "$rel/wasm-pkg-tools/releases/download/v${WKG_VERSION}/wkg-x86_64-unknown-linux-gnu"
          curl -fsSL -o "$bin/wac" "$rel/wac/releases/download/v${WAC_VERSION}/wac-cli-x86_64-unknown-linux-musl"
          chmod +x "$bin/wkg" "$bin/wac"
          "$bin/wasm-tools" --version; "$bin/wasmtime" --version; "$bin/wkg" --version; "$bin/wac" --version

      # dapr4s's build runs `wit-bindgen-scala` (crate 0.1.0) when its wasm artifacts are published.
      - name: Cache wit-bindgen-scala
        id: cache-wbs
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wit-bindgen-scala
          key: wit-bindgen-scala-0.1.0-${{ runner.os }}
      - name: Install wit-bindgen-scala
        if: steps.cache-wbs.outputs.cache-hit != 'true'
        run: cargo install wit-bindgen-scala --version 0.1.0 --locked

      - name: Install the dapr CLI and daprd (slim)
        run: |
          wget -q https://raw.githubusercontent.com/dapr/cli/v1.15.1/install/install.sh -O - | /bin/bash -s 1.15.1
          dapr init --slim --runtime-version 1.17.7
          echo "$HOME/.dapr/bin" >> "$GITHUB_PATH"

      # dapr4s (and .mill-version here) is on an unreleased Mill + mill-scalablytyped: dapr4s's
      # scripts/upstream-snapshot.sh (at the pinned commit) builds and installs them, cached by its hash.
      - name: Fetch dapr4s's upstream-snapshot.sh
        id: snapshot
        run: |
          f="$RUNNER_TEMP/upstream-snapshot.sh"
          curl -fsSL --retry 3 -o "$f" \
            "https://raw.githubusercontent.com/sideeffffect/dapr4s/$DAPR4S_COMMIT/scripts/upstream-snapshot.sh"
          chmod +x "$f"
          echo "script=$f" >> "$GITHUB_OUTPUT"
          echo "hash=$(sha256sum "$f" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache the upstream Mill + mill-scalablytyped snapshots
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/mill/download
            ~/.ivy2/local/com.lihaoyi
            ~/.ivy2/local/com.github.lolgab
          key: upstream-snapshot-${{ steps.snapshot.outputs.hash }}
      - name: Build the upstream Mill + mill-scalablytyped snapshots
        run: ${{ steps.snapshot.outputs.script }}

      # The plugin + the five dapr4s wasm artifacts (incl. dapr4s-wasm-linker_2.13, compiled from scala-wasm's release
      # commit + dapr4s's patch) land in ~/.ivy2/local and are a pure function of the pinned dapr4s commit: cache
      # them under it. On a miss, wasm/scripts/publish-dapr4s-wasm.sh clones dapr4s at that commit and runs its
      # Mill publishLocal. It must run before the first ./mill here (build.mill's header loads the plugin).
      - name: Cache the dapr4s plugin + wasm artifacts (~/.ivy2/local)
        id: cache-dapr4s
        uses: actions/cache@v5
        with:
          path: ~/.ivy2/local/com.github.sideeffffect
          key: dapr4s-wasm-mill-artifacts-${{ env.DAPR4S_COMMIT }}-${{ env.DAPR4S_CORE_RELEASE }}
      - name: Publish the dapr4s plugin + wasm artifacts locally (cache miss)
        if: steps.cache-dapr4s.outputs.cache-hit != 'true'
        run: wasm/scripts/publish-dapr4s-wasm.sh all

      - name: Build + run the WASI-component e2e (./mill wasm.e2e)
        timeout-minutes: 30
        run: ./mill wasm.e2e

      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-wasm
          path: out/wasm/e2e.dest/logs/
          if-no-files-found: ignore

  slides:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # build.mill's header loads the dapr4s Mill plugin (examples 18/19): publishLocal it first.
      - uses: ./.github/actions/dapr4s-mill-plugin

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Use the runner's pre-installed Chrome instead of letting Puppeteer
      # download its own; the build.mill slides task auto-detects this path.
      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Build slides PDF
        run: ./mill slides
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload slides PDF
        uses: actions/upload-artifact@v6
        with:
          name: slides
          path: out/slides.dest/SLIDES.pdf
          if-no-files-found: error
